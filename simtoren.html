<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SimToren - TobyGames</title>
  <link rel="stylesheet" href="simtoren/style.css?v=20">
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="top">
    <a class="pill back" href="index.html" title="Terug naar TobyGames">&larr;</a>
    <div class="pill" title="Geld">💰 <b id="s-money">€0</b> <small id="s-today"></small></div>
    <div class="pill" title="Dag en tijd">🕗 <b id="s-time"></b></div>
    <div class="pill" id="s-starbox" title="Sterren: meer inwoners = meer sterren">
      <b id="s-stars">⭐</b>
      <span class="bar"><i id="s-bar"></i></span>
      <small id="s-pop"></small>
    </div>
    <div class="pill" title="Tevredenheid van je toren"><span id="s-face">😀</span> <b id="s-mood">100%</b></div>
    <div class="pill speed" title="Snelheid (spatiebalk = pauze)">
      <button data-speed="0">⏸</button>
      <button data-speed="1">▶</button>
      <button data-speed="2">▶▶</button>
      <button data-speed="3">▶▶▶</button>
    </div>
    <div class="pill btns">
      <button id="b-undo" title="Ongedaan maken (Ctrl+Z)">↩️</button>
      <button id="b-sound" title="Geluid aan/uit">🔊</button>
      <button id="b-help" title="Uitleg">❓</button>
      <button id="b-menu" title="Menu">☰</button>
    </div>
  </div>

  <div id="mission"></div>
  <div id="info" class="hidden"></div>

  <div id="zoom">
    <button id="z-in" title="Inzoomen">＋</button>
    <button id="z-out" title="Uitzoomen">－</button>
    <button id="z-home" title="Hele toren in beeld">⌂</button>
  </div>

  <div id="bottom">
    <div id="hint"></div>
    <div id="tools"></div>
  </div>

  <div id="toasts"></div>
  <div id="overlay" class="hidden"><div id="modal"></div></div>

  <script src="simtoren/game.js?v=20"></script>
</body>
</html>
