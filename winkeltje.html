<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winkeltje - TobyGames</title>
    <link rel="stylesheet" href="winkeltje/style.css">
</head>
<body>
    <!-- Header -->
    <div class="game-header">
        <a href="index.html" class="back-link">< TobyGames</a>
        <h1>Winkeltje</h1>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-item">
            <span class="icon">&#x1F4B0;</span>
            <div>
                <div class="value" id="hudMoney">&#x20AC;0</div>
                <div class="label">Geld</div>
            </div>
        </div>
        <div class="hud-item">
            <span class="icon">&#x1F465;</span>
            <div>
                <div class="value" id="hudServed">0</div>
                <div class="label">Bediend</div>
            </div>
        </div>
        <div class="hud-item">
            <span class="icon">&#x2B50;</span>
            <div>
                <div class="value" id="hudLevel">1</div>
                <div class="label">Level</div>
            </div>
        </div>
        <div class="hud-item">
            <span class="icon">&#x1F324;</span>
            <div>
                <div class="value" id="hudDay">1</div>
                <div class="label">Dag</div>
            </div>
        </div>
    </div>

    <!-- Carry bar -->
    <div class="carry-bar" id="carryBar"></div>

    <!-- Canvas -->
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Overlays inside wrapper -->
        <div class="level-up-banner" id="levelBanner"></div>

        <div class="overlay" id="pauseOverlay">
            <div class="overlay-content">
                <h2>Gepauzeerd</h2>
                <p>Druk op <strong>ESC</strong> of <strong>P</strong> om verder te gaan.</p>
                <button class="overlay-btn" onclick="Game.togglePause()">Hervat</button>
            </div>
        </div>

        <div class="overlay" id="dayOverlay">
            <div class="overlay-content"></div>
        </div>

        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-content"></div>
        </div>

        <!-- Upgrade panel -->
        <div class="upgrade-panel" id="upgradePanel">
            <h3>Upgrades</h3>
            <div class="upgrade-list"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
        <button class="ctrl-btn" id="pauseBtn" onclick="Game.togglePause()">Pauze</button>
        <button class="ctrl-btn" onclick="Game.toggleUpgradePanel()">Upgrades (U)</button>
        <button class="ctrl-btn" onclick="Game.restart()">Herstart</button>
    </div>

    <!-- Instructions -->
    <div class="instructions">
        <kbd>Pijltjes</kbd> of <kbd>WASD</kbd> om te lopen &bull;
        <kbd>Spatie</kbd> om items op te pakken, af te rekenen of weg te gooien &bull;
        <kbd>U</kbd> voor upgrades &bull;
        <kbd>P</kbd> / <kbd>ESC</kbd> voor pauze
    </div>

    <script src="winkeltje/data.js"></script>
    <script src="winkeltje/renderer.js"></script>
    <script src="winkeltje/game.js"></script>
    <script>
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', Game.init);
        } else {
            Game.init();
        }
    </script>
</body>
</html>
